{% load static %}
<header class="site-header">
  <div class="container">
    <nav class="navbar">
      <a class="logo" href="{% url 'landing:home' %}">
        <span class="logo-mark-wrap">
          <img class="logo-mark" src="{% static 'img/favicon.svg' %}" alt="UzbekBurger">
        </span>
        <span class="logo-text">
          <strong>UzbekBurger</strong>
          {% comment %} <small>POS style menu</small> {% endcomment %}
        </span>
      </a>

      <button class="hamburger" aria-label="Menu" type="button" data-open-label="Menu" data-close-label="Yopish">Menu</button>

      <div class="nav-links">
        <a class="nav-link {% if active_page == 'home' %}active{% endif %}" href="{% url 'landing:home' %}">Bosh sahifa</a>
        <a class="nav-link {% if active_page == 'about' %}active{% endif %}" href="{% url 'landing:about' %}">Biz haqimizda</a>
        <a class="nav-link {% if active_page == 'menu' %}active{% endif %}" href="{% url 'landing:menu' %}">Menu</a>
        <a class="nav-link {% if active_page == 'branches' %}active{% endif %}" href="{% url 'landing:branches' %}">Filiallar</a>
        <a class="nav-link {% if active_page == 'posts' %}active{% endif %}" href="{% url 'landing:posts' %}">Yangiliklar</a>
        <a class="nav-link {% if active_page == 'contact' %}active{% endif %}" href="{% url 'landing:contact' %}">Aloqa</a>
      </div>

      <div class="nav-actions">
        <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Mavzu">
          <span class="theme-toggle-label">Mavzu</span>
        </button>
      </div>
    </nav>
  </div>
</header>
