{% extends "landing/base.html" %}
{% load static %}

{% block title %}Menu - UzbekBurger{% endblock %}
{% block body_class %}menu-page{% endblock %}

{% block content %}
<section class="menu-shell">
  <div class="container">
    <div class="menu-surface">
      <form class="menu-toolbar" id="landingMenuFilters" action="{% url 'landing:menu' %}" method="get" data-live-url="{% url 'landing:menu_live' %}">
        <div class="menu-search-wrap">
          <label class="sr-only" for="landingMenuSearch">Qidirish</label>
          <span class="menu-search-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" role="presentation">
              <circle cx="11" cy="11" r="6" stroke="currentColor" stroke-width="2"></circle>
              <path d="M20 20L15.5 15.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
            </svg>
          </span>
          <input
            id="landingMenuSearch"
            class="menu-search-input"
            type="search"
            name="q"
            value="{{ q }}"
            placeholder="Burger, set, ichimlik yoki kategoriya bo'yicha qidiring"
            autocomplete="off"
          >
          <button class="menu-search-clear" id="landingMenuSearchClear" type="button" {% if not q %}hidden{% endif %}>Tozalash</button>
        </div>

        <input type="hidden" name="type" id="landingMenuTypeInput" value="{{ type }}">
        <input type="hidden" name="category" id="landingMenuCategoryInput" value="{{ category }}">

        <div class="menu-type-pills" id="landingTypeFilters">
          <button class="menu-type-pill {% if not type %}is-active{% endif %}" type="button" data-type="">Barchasi</button>
          <button class="menu-type-pill {% if type == 'fastfood' %}is-active{% endif %}" type="button" data-type="fastfood">Fastfood</button>
          <button class="menu-type-pill {% if type == 'drink' %}is-active{% endif %}" type="button" data-type="drink">Ichimliklar</button>
          <button class="menu-type-pill {% if type == 'set' %}is-active{% endif %}" type="button" data-type="set">Setlar</button>
        </div>

        <div class="menu-toolbar-meta">
          <span class="menu-live-status" id="landingMenuLiveStatus" aria-live="polite">Natijalar yozayotganingizda yangilanadi</span>
        </div>
      </form>

      <div id="landingMenuPanel">
        {% include "landing/partials/menu_panel.html" %}
      </div>
    </div>
  </div>
</section>
{% endblock %}
